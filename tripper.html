<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tripper Car Bearing Temp — ITH-CV</title>
<style>
  :root{--bg:#0f1720;--panel:#16212e;--muted:#8aa0b6;--line:#243244;--shadow:0 6px 18px rgba(0,0,0,.25);--warn:#f5a623;--alarm:#e02424;}
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#0f1720,#0b1017);color:#e7eef6;min-height:100vh;padding:18px 16px 40px;}
  header{max-width:1100px;margin:0 auto 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .logo{height:46px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;padding:4px 8px;box-shadow:var(--shadow)}.logo img{height:100%;width:auto;display:block;object-fit:contain}
  .titles h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.3px}
  .titles p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .nav{margin-left:auto;display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}
  .lnk{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:999px;background:var(--panel);color:#cdd9e5;border:1px solid var(--line);cursor:pointer;font-size:13px;font-weight:600;text-decoration:none;font-family:inherit;transition:background .15s,border-color .15s}
  .lnk:hover{background:#1c2a3a;border-color:#31465c}
  .lnk:active{transform:translateY(1px)}
  .lnk:disabled{opacity:.7;cursor:default}
  .lnk .ic{display:inline-block;font-size:15px;line-height:1}
  .lnk.spin .ic{animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .cd{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(31,111,235,.12);border:1px solid rgba(31,111,235,.35);color:#9cc2ff;font-size:13px;font-weight:600;white-space:nowrap}
  .cd b{color:#dbe9ff;font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .cd.soon{background:rgba(245,166,35,.14);border-color:rgba(245,166,35,.45);color:#ffd591}
  .cd.soon b{color:#ffe6bf}
  .status{text-align:right;font-size:13px;color:var(--muted)}
  .status .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2ecc71;margin-right:6px;box-shadow:0 0 0 0 rgba(46,204,113,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,204,113,.5)}70%{box-shadow:0 0 0 8px rgba(46,204,113,0)}100%{box-shadow:0 0 0 0 rgba(46,204,113,0)}}
  .status b{color:#e7eef6}

  .stage{position:relative;max-width:1100px;margin:0 auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);container-type:inline-size}
  .stage img{width:100%;display:block}
  .tv{position:absolute;transform:translate(-50%,-50%);font-weight:500;font-size:1.5cqw;color:#111;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1;text-align:center}
  .tv.ok{color:#0a8f3c}
  .tv.warn{color:#e07d00}
  .tv.alarm{color:#d10000;animation:blink 1s steps(1,end) infinite}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}

  footer{max-width:1100px;margin:22px auto 0;color:var(--muted);font-size:12px;text-align:center;line-height:1.7}
</style>
</head>

<script>
const WARN = 70, ALARM = 80;
const TAGS = ["DCV_TC_L","DCV_TC_R","BEND_L","BEND_R","TAKE_UP_L","TAKE_UP_R"];
let DATA = null;

function fmtTime(iso){
  try{ const d=new Date(iso);
    return d.toLocaleString('th-TH',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})+' น.';
  }catch(e){ return iso; }
}

function render(){
  if(!DATA) return;
  const map = {};
  Object.values(DATA.groups||{}).forEach(arr=>arr.forEach(it=>{ map[it.tag]=it.value; }));
  TAGS.forEach(tag=>{
    const el = document.getElementById(tag);
    if(!el) return;
    const v = Number(map[tag]);
    if(map[tag]==null || isNaN(v)){ el.textContent='—'; el.className='tv'; return; }
    let cls='tv'; if(v>=ALARM)cls+=' alarm'; else if(v>=WARN)cls+=' warn'; else cls+=' ok';
    el.className=cls; el.textContent=v.toFixed(1);
  });
  document.getElementById('updated').textContent = fmtTime(DATA.updated);
}

async function load(){
  try{
    const r = await fetch('temps.json?_=' + Date.now(), {cache:'no-store'});
    DATA = await r.json();
    render();
  }catch(e){ console.error('load failed', e); }
}

// ---- shared 5-min countdown (persists across pages via localStorage) ----
const PERIOD = 5 * 60 * 1000;   // ms
const CD_KEY = 'ith_temp_next_update';
function cdGet(){ const v = parseInt(localStorage.getItem(CD_KEY)||'0',10); return isNaN(v)?0:v; }
function cdSet(t){ try{ localStorage.setItem(CD_KEY, String(t)); }catch(e){} }
function drawCountdown(){
  const el=document.getElementById('cdVal'), box=document.getElementById('countdown');
  let rem = cdGet() - Date.now(); if(rem < 0) rem = 0;
  const sec = Math.floor(rem/1000), m = Math.floor(sec/60), s = sec % 60;
  el.textContent = m + ':' + String(s).padStart(2,'0');
  box.classList.toggle('soon', rem <= 60000);
}
function resetCountdown(){ cdSet(Date.now() + PERIOD); drawCountdown(); }
function tickCountdown(){
  const next = cdGet();
  if(!next || next <= Date.now()){ load(); cdSet(Date.now() + PERIOD); }
  drawCountdown();
}
setInterval(tickCountdown, 1000);

async function refresh(){
  const btn=document.getElementById('refreshBtn');
  btn.classList.add('spin'); btn.disabled=true;
  await load(); resetCountdown();
  setTimeout(()=>{ btn.classList.remove('spin'); btn.disabled=false; }, 500);
}
document.getElementById('refreshBtn').addEventListener('click', refresh);

load();            // show data right away
if(!cdGet() || cdGet() <= Date.now()) cdSet(Date.now() + PERIOD);   // start a cycle only if none is running
drawCountdown();   // continue the shared countdown (do NOT reset on page switch)
</script>
