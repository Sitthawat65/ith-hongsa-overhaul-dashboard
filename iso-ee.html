<title>ISO EE Plan Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">

<style id="css">
:root{
  --bg1:#091630; --bg2:#0C1F42;
  --panel:#122850; --panel-2:#0F2246; --line:#1E4079; --line-soft:#193764;
  --ink:#FFFFFF; --ink-soft:#93ACD4; --ink-faint:#5E7BA8;
  --track:#17325C;
  --cyan:#35A0F5; --teal:#2FE0B0; --amber:#FFC24B; --coral:#FF7B6B; --violet:#8E7BFF;
  --ok:var(--teal); --doing:var(--cyan); --soon:var(--amber); --late:var(--coral);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg1);
  background-image:linear-gradient(155deg,var(--bg1) 0%,var(--bg2) 55%,#0A1A38 100%);
  background-attachment:fixed; color:var(--ink);
  font-family:"IBM Plex Sans Thai","IBM Plex Sans",system-ui,sans-serif;
  font-size:15px; line-height:1.6; -webkit-text-size-adjust:100%;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.wrap{max-width:1320px; margin:0 auto; padding:18px 16px 60px}
@media (max-width:640px){ .wrap{padding:12px 11px 48px} }

/* ---------- หัวเรื่อง ---------- */
.top{display:flex; align-items:flex-start; gap:14px; flex-wrap:wrap; margin-bottom:14px}
.brand{flex:1 1 220px; min-width:0}
.brand h1{margin:0; font-size:clamp(16px,4.2vw,20px); font-weight:700; letter-spacing:.01em;
  text-wrap:balance; overflow-wrap:anywhere; color:var(--ink)}
.brand p{margin:2px 0 0; font-size:12.5px; color:var(--ink-soft); overflow-wrap:anywhere}
.top .right{margin-left:auto; text-align:right; font-size:11.5px; color:var(--ink-soft);
  line-height:1.5; flex:none}
.saving{display:inline-flex; align-items:center; gap:6px; font-size:11.5px}
.dot{width:7px; height:7px; border-radius:50%; background:var(--teal); flex:none;
  box-shadow:0 0 0 3px rgba(47,224,176,.15)}
.dot.busy{background:var(--amber); box-shadow:0 0 0 3px rgba(255,194,75,.15); animation:pulse 1s infinite}
.dot.off{background:var(--ink-faint); box-shadow:none}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){ .dot.busy{animation:none} }

/* ---------- แท็บ ---------- */
.tabs{display:flex; gap:2px; overflow-x:auto; border-bottom:1px solid var(--line-soft); margin:0 0 14px}
.tabs::-webkit-scrollbar{height:0}
.tabs button{font:inherit; font-size:13.5px; white-space:nowrap; background:none; border:none;
  color:var(--ink-soft); padding:9px 14px 8px; cursor:pointer;
  border-bottom:2px solid transparent; margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--ink); font-weight:600; border-bottom-color:var(--cyan)}
.tabs button:focus-visible{outline:2px solid var(--cyan); outline-offset:-3px; border-radius:3px}

/* ---------- แผง ---------- */
.panels{display:grid; gap:11px; grid-template-columns:repeat(12,1fr)}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:5px;
  padding:13px 15px 15px; min-width:0; display:flex; flex-direction:column}
.panel > h3{margin:0 0 11px; font-size:12.5px; font-weight:600; color:var(--ink);
  letter-spacing:.02em; display:flex; align-items:center; gap:8px}
.panel > h3 .c{font-size:11.5px; font-weight:400; color:var(--ink-faint); margin-left:auto}
button.panel{text-align:left; font:inherit; color:var(--ink); cursor:pointer;
  transition:border-color .13s, transform .13s}
button.panel:hover{border-color:var(--cyan); transform:translateY(-1px)}
button.panel:focus-visible{outline:2px solid var(--cyan); outline-offset:2px}
.c3{grid-column:span 3} .c4{grid-column:span 4} .c5{grid-column:span 5}
.c6{grid-column:span 6} .c7{grid-column:span 7} .c8{grid-column:span 8} .c12{grid-column:span 12}
@media (max-width:1000px){ .c3,.c4,.c5{grid-column:span 6} .c7,.c8{grid-column:span 12} }
@media (max-width:620px){ .c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12} }

/* ---------- ตัวเลขและวงแหวน ---------- */
.big{font-size:34px; font-weight:600; line-height:1.05; letter-spacing:-.01em}
.big.sm{font-size:26px}
.cap{font-size:11.5px; color:var(--ink-soft)}
.kpirow{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:auto}
.delta{font-size:11px; font-weight:600; padding:2px 9px; border-radius:99px}
.d-ok{background:rgba(47,224,176,.14); color:var(--teal)}
.d-soon{background:rgba(255,194,75,.14); color:var(--amber)}
.d-late{background:rgba(255,123,107,.14); color:var(--coral)}
.d-idle{background:rgba(53,160,245,.14); color:var(--cyan)}
.rings{display:flex; gap:14px; justify-content:space-around; flex-wrap:wrap}
.ringbox{text-align:center; min-width:92px}
.ringbox .lb{font-size:11.5px; color:var(--ink-soft); margin-top:3px}

/* ---------- แถบแนวนอน ---------- */
.blist{display:flex; flex-direction:column; gap:11px}
.brow{display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:baseline}
.brow .nm{font-size:12.5px; color:var(--ink)}
.brow .vl{font-size:12.5px; color:var(--ink-soft)}
.track{grid-column:1/-1; height:6px; border-radius:99px; background:var(--track); overflow:hidden}
.track i{display:block; height:100%; border-radius:99px; background:var(--cyan); transition:width .35s}
@media (prefers-reduced-motion:reduce){ .track i{transition:none} }
.track i.ok{background:var(--teal)} .track i.soon{background:var(--amber)}
.track i.late{background:var(--coral)}

/* ---------- รายการเตือน ---------- */
.mini{display:flex; flex-direction:column; gap:9px; max-height:236px; overflow:auto}
.mini::-webkit-scrollbar{width:5px} .mini::-webkit-scrollbar-thumb{background:var(--line); border-radius:9px}
.mrow{display:flex; gap:9px; align-items:flex-start; padding-left:9px; border-left:2px solid var(--coral)}
.mrow.soon{border-left-color:var(--amber)}
.mrow .t{font-size:12.5px; line-height:1.4}
.mrow .s{font-size:11px; color:var(--ink-faint)}
.mrow .r{margin-left:auto; font-size:11.5px; white-space:nowrap; color:var(--coral)}
.mrow.soon .r{color:var(--amber)}
.empty{font-size:12.5px; color:var(--ink-faint); padding:6px 0}

/* ---------- รายการงาน ---------- */
.phead{display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap; margin:2px 0 12px}
.phead h2{margin:0; font-size:18px; font-weight:700; color:var(--ink)}
.phead .sub{color:var(--ink-soft); font-size:12.5px}
.items{display:flex; flex-direction:column; gap:8px}
.item{background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--line);
  border-radius:5px; padding:12px 14px}
.item.is-late{border-left-color:var(--coral)}
.item.is-soon{border-left-color:var(--amber)}
.item.is-done{border-left-color:var(--teal)}
.item .r1{display:flex; gap:12px; align-items:flex-start}
.item .nm{font-weight:500; flex:1; min-width:0; font-size:14px; color:var(--ink)}
.item .due{font-size:11.5px; color:var(--ink-soft); white-space:nowrap}
.item.is-late .due{color:var(--coral)}
.ptag{display:inline-block; font-size:10.5px; font-weight:500; color:var(--cyan);
  background:rgba(53,160,245,.13); border-radius:3px; padding:1px 7px; margin-right:7px; vertical-align:1px}
.item .r2{display:flex; gap:9px; align-items:center; margin-top:9px; flex-wrap:wrap}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:5px; overflow:hidden}
.seg button{font:inherit; font-size:12px; padding:5px 11px; border:none; background:var(--panel-2);
  color:var(--ink-soft); cursor:pointer; border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--cyan); color:#06182F; font-weight:600}
.seg button:focus-visible{outline:2px solid var(--cyan); outline-offset:-2px}
.item .barwrap{flex:1; min-width:110px; display:flex; align-items:center; gap:9px}
.item .pcv{font-size:12px; color:var(--ink-soft); min-width:34px; text-align:right}
.rowbtn{font:inherit; font-size:12px; padding:5px 10px; border-radius:5px; cursor:pointer;
  border:1px solid var(--line); background:var(--panel-2); color:var(--ink-soft)}
.rowbtn:hover{border-color:var(--cyan); color:var(--cyan)}
.rowbtn:focus-visible{outline:2px solid var(--cyan); outline-offset:1px}
.rowbtn.on{background:rgba(53,160,245,.14); border-color:var(--cyan); color:var(--cyan)}
.acked{font-size:11.5px; color:var(--teal); display:flex; align-items:center; gap:5px}

.detail{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); display:grid; gap:9px}
.fld{display:grid; gap:4px}
.fld label{font-size:11px; color:var(--ink-faint); letter-spacing:.02em}
.fld input,.fld textarea,.fld select{
  font:inherit; font-size:13px; padding:7px 9px; border:1px solid var(--line);
  border-radius:5px; background:var(--panel-2); color:var(--ink); width:100%}
.fld textarea{resize:vertical; min-height:54px}
.fld input:focus-visible,.fld textarea:focus-visible,.fld select:focus-visible{
  outline:2px solid var(--cyan); outline-offset:-1px; border-color:var(--cyan)}
.fld ::placeholder{color:var(--ink-faint)}
.two{display:grid; grid-template-columns:1fr 1fr; gap:9px}
@media (max-width:560px){ .two{grid-template-columns:1fr} }
.ro{background:rgba(255,194,75,.1); border:1px solid var(--amber); color:var(--ink);
  border-radius:5px; padding:9px 12px; font-size:12.5px; margin-bottom:12px}
footer{margin-top:22px; padding-top:12px; border-top:1px solid var(--line-soft);
  color:var(--ink-faint); font-size:11.5px; text-align:center}
</style>

<div class="wrap" id="root"></div>

{"updated":"","rev":0,"log":{}}
</script>

<script id="app">
(function(){
  "use strict";

  /* ---------- แผนงานจากไฟล์ Excel "แผนติดตามงาน ISO EE" ---------- */
  var PLAN = [
    ["M","ประจำเดือน","ตรวจเช็คเครื่องจักรประจำเดือน Spreader"],
    ["M","ประจำเดือน","ตรวจเช็คเครื่องจักรประจำเดือน Bucket Wheel"],
    ["M","ประจำเดือน","ตรวจเช็คเครื่องจักรประจำเดือน Crusher"],
    ["M","ประจำเดือน","ตรวจเช็คหม้อแปลงไฟฟ้า"],
    ["M","ประจำเดือน","PM Carbon Brush"],
    ["M","ประจำเดือน","อัดจาระบี Bearing Motor"],
    ["M","ประจำเดือน","ตรวจเช็คประสิทธิภาพของมอเตอร์ไฟฟ้า Work shop"],
    ["M","ประจำเดือน","ตรวจเช็คตู้โหลดไฟฟ้า Work shop"],
    ["Q","ไตรมาส","ตรวจเช็คระบบ Emergency ใน Line สายพาน"],
    ["Q","ไตรมาส","ตรวจเช็คระบบ Emergency ในเครื่องจักร"],
    ["Q","ไตรมาส","ตรวจเช็คสายไฟฟ้า 6.6kV ของ Front Shovel"],
    ["Q","ไตรมาส","ตรวจเช็คสายไฟฟ้าและ Box ไฟฟ้า 6.6kV ที่ Line ของ Spreader"],
    ["Q","ไตรมาส","ตรวจเช็คสายไฟฟ้าและ Box ไฟฟ้า 6.6kV ที่ Line ของ Bucket Wheel"],
    ["Q","ไตรมาส","ตรวจเช็คสายไฟฟ้า 6.6kV จ่ายให้เครื่องจักร Spreader"],
    ["Q","ไตรมาส","ตรวจเช็คสายไฟฟ้า 6.6kV จ่ายให้เครื่องจักร Bucket Wheel"],
    ["H","ครึ่งปี","ตรวจเช็ค Power Line 22kV"],
    ["H","ครึ่งปี","ตรวจสอบความร้อนในระบบไฟฟ้าแรงสูง"],
    ["H","ครึ่งปี","ตรวจเช็ค Terminal Box ของเครื่องจักรในระบบสายพาน"],
    ["H","ครึ่งปี","ตรวจเช็คสัญญาณของ Fiber Optic"],
    ["Y","ประจำปี","แผนการ Overhaul Motor"],
    ["Y","ประจำปี","ตรวจเช็ค E-House & R-House ของระบบสายพาน"],
    ["Y","ประจำปี","ตรวจเช็ค E-House ของเครื่องจักร Spreader"],
    ["Y","ประจำปี","ตรวจเช็ค E-House ของเครื่องจักร Bucket Wheel"],
    ["Y","ประจำปี","ตรวจเช็ค E-House ของเครื่องจักร Crusher"],
    ["Y","ประจำปี","ตรวจเช็คหม้อแปลงไฟฟ้า + ส่งน้ำมันหม้อแปลงทดสอบ"],
    ["Y","ประจำปี","ตรวจเช็คค่าความต้านทานสายดิน (Ground) ใน Instruction Area"],
    ["Y","ประจำปี","ตรวจเช็คค่าความต้านทานสายดิน (Ground) ใน Mining Area"],
    ["Y","ประจำปี","ตรวจเช็คตู้ MDB & Consumer & Generator"],
    ["Y","ประจำปี","แบบวิเคราะห์กระบวนการทำงาน"],
    ["Y","ประจำปี","เอกสาร Calibrate เครื่องมือ"]
  ];
  var PERIOD = {
    M:{name:"ประจำเดือน", remind:"เตือนวันที่ 25–30 ทุกเดือน"},
    Q:{name:"ไตรมาส",     remind:"เตือนวันที่ 25–30 เดือน 3, 6, 9, 12"},
    H:{name:"ครึ่งปี",     remind:"เตือนวันที่ 25–30 เดือน 6, 12"},
    Y:{name:"ประจำปี",     remind:"เตือนวันที่ 25–30 เดือน 10, 11, 12"}
  };
  var ORDER = ["M","Q","H","Y"];
  var THMON = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];

/* ---------- สถานะที่บันทึกไว้ ---------- */
  var STATE;
  try { STATE = JSON.parse(document.getElementById("state").textContent) || {}; }
  catch(e){ STATE = {}; }
  if(!STATE.log) STATE.log = {};
  try {
    var saved = JSON.parse(localStorage.getItem("iso_ee_status_v1") || "null");
    if(saved && saved.log && (saved.rev || 0) >= (STATE.rev || 0)) STATE = saved;
  } catch(e){}

  // live     = อยู่บนหน้าเผยแพร่ บันทึกแล้วทุกเครื่องเห็นตรงกัน
  // local    = อยู่บนเว็บทั่วไป (GitHub Pages) บันทึกไว้ในเบราว์เซอร์เครื่องนี้
  // readonly = ไม่มีสิทธิ์แก้ไข
  var LS_KEY = "iso_ee_status_v1";
  var artifactApi = null, mode = "local", saving = "idle";
  function canEdit(){ return mode !== "readonly"; }
  function lsAvailable(){ try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }
                          catch(e){ return false; } }
  var view = { period:null, filter:null, open:{} };

  /* ---------- รอบงานปัจจุบันของแต่ละช่วงเวลา ---------- */
  function cycleOf(code, now){
    var y = now.getFullYear(), m = now.getMonth() + 1, be = y + 543;
    if(code === "M")
      return {key:y+"-"+pad(m), label:THMON[m-1]+" "+be, due:new Date(y, m-1, 5)};
    if(code === "Q"){
      var q = Math.ceil(m/3), endM = q*3 + 1;
      var dy = endM > 12 ? y+1 : y, dm = endM > 12 ? endM-12 : endM;
      return {key:y+"-Q"+q, label:"ไตรมาส "+q+"/"+be, due:new Date(dy, dm, 0)};
    }
    if(code === "H"){
      var h = m <= 6 ? 1 : 2;
      return {key:y+"-H"+h, label:"ครึ่งปีที่ "+h+"/"+be, due:new Date(y, h===1?6:12, 0)};
    }
    return {key:String(y), label:"ปี "+be, due:new Date(y, 11, 0)};
  }
  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function today(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
  function dayDiff(a,b){ return Math.round((a-b)/86400000); }
  function fmtDate(d){ return d.getDate()+" "+THMON[d.getMonth()]+" "+(d.getFullYear()+543); }

  /* ---------- รวมแผน + สถานะ = รายการที่ใช้แสดงผล ---------- */
  function build(){
    var now = today(), out = [];
    PLAN.forEach(function(row, i){
      var code = row[0], id = code + "-" + i;
      var cyc = cycleOf(code, now);
      var rec = (STATE.log[id] && STATE.log[id][cyc.key]) || {};
      var status = rec.status || "todo";
      var prog = status === "done" ? 100 : (typeof rec.progress === "number" ? rec.progress : (status === "doing" ? 50 : 0));
      var left = dayDiff(cyc.due, now);
      var late = status !== "done" && left < 0;
      out.push({
        id:id, code:code, period:row[1], name:row[2],
        cyc:cyc, status:status, progress:prog,
        owner:rec.owner || "", reason:rec.reason || "", note:rec.note || "",
        doc:rec.doc || "none",
        ack:rec.ack || null, at:rec.at || "", by:rec.by || "",
        left:left, late:late,
        soon: status !== "done" && left >= 0 && left <= 7
      });
    });
    return out;
  }

  function summarise(items){
    var n = items.length || 1;
    var prog = items.reduce(function(s,x){ return s + x.progress; }, 0) / n;
    return {
      pct: Math.round(prog),
      done: items.filter(function(x){ return x.status === "done"; }).length,
      doing: items.filter(function(x){ return x.status === "doing"; }).length,
      late: items.filter(function(x){ return x.late; }).length,
      soon: items.filter(function(x){ return x.soon; }).length,
      total: items.length
    };
  }

  /* ---------- เขียนค่าลงสถานะ แล้วบันทึก ---------- */
  function setField(id, cycKey, patch){
    if(!canEdit()) return;
    if(!STATE.log[id]) STATE.log[id] = {};
    var rec = STATE.log[id][cycKey] || (STATE.log[id][cycKey] = {});
    Object.keys(patch).forEach(function(k){ rec[k] = patch[k]; });
    rec.at = new Date().toISOString();
    render();
    save();
  }

  var saveTimer = null;
  function save(){
    if(mode === "readonly") return;
    if(mode === "local"){                       // เก็บไว้ในเบราว์เซอร์เครื่องนี้
      STATE.updated = new Date().toISOString();
      STATE.rev = (STATE.rev || 0) + 1;
      try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); saving = "saved"; }
      catch(e){ saving = "error"; }
      paintSave(); return;
    }
    if(!artifactApi) return;
    clearTimeout(saveTimer);
    saving = "pending"; paintSave();
    saveTimer = setTimeout(commit, 1200);          // รวมการแก้หลายครั้งเป็นการบันทึกครั้งเดียว
  }
  function commit(){
    if(!artifactApi) return;
    saving = "saving"; paintSave();
    STATE.updated = new Date().toISOString();
    STATE.rev = (STATE.rev || 0) + 1;
    artifactApi.publish(pageHTML()).then(function(){
      saving = "saved"; paintSave();
    })["catch"](function(err){
      var code = err && err.code;
      if(code === "conflict"){ saving = "idle"; return; }   // มีคนบันทึกก่อน หน้าจะโหลดใหม่เอง
      if(code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "consent_required"){
        mode = "readonly"; saving = "readonly"; render(); return;
      }
      if(code === "rate_limited"){ saving = "pending"; saveTimer = setTimeout(commit, 6000); return; }
      saving = "error"; paintSave();
    });
  }
  function paintSave(){
    var el = document.getElementById("saveState");
    if(!el) return;
    var map = {
      idle:["", mode === "live" ? "บันทึกอัตโนมัติ · ซิงค์ทุกเครื่อง"
                : mode === "local" ? "บันทึกในเครื่องนี้" : "ดูอย่างเดียว"],
      pending:["busy","กำลังบันทึก…"], saving:["busy","กำลังบันทึก…"],
      saved:["", "บันทึกแล้ว"], error:["off","บันทึกไม่สำเร็จ"], readonly:["off","ดูอย่างเดียว"]
    };
    var m = map[saving] || map.idle;
    el.innerHTML = '<span class="dot ' + m[0] + '"></span>' + esc(m[1]);
  }

  /* ---------- สร้างเอกสารทั้งหน้าเพื่อบันทึกเป็นเวอร์ชันใหม่ ---------- */
  function pageHTML(){
    var css = document.getElementById("css").textContent;
    var app = document.getElementById("app").textContent;
    var S = "script";
    return '<!doctype html><html lang="th"><head><meta charset="utf-8">'
      + '<meta name="viewport" content="width=device-width, initial-scale=1">'
      + '<title>ISO EE Plan Tracker</title>'
      + '<link rel="preconnect" href="https://fonts.googleapis.com">'
      + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
      + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600'
      + '&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">'
      + '<style id="css">' + css + '</style></head><body>'
      + '<div class="wrap" id="root"></div>'
      + '<' + S + ' id="state" type="application/json">' + JSON.stringify(STATE).replace(/</g,"\\u003c") + '</' + S + '>'
      + '<' + S + ' id="app">' + app + '</' + S + '>'
      + '</body></html>';
  }

  
  /* ---------- ตัวช่วยวาด ---------- */
  function esc(s){ return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  function ring(pct, size, color, label){
    var sw = Math.max(7, size*0.11), r = (size-sw)/2, c = 2*Math.PI*r, off = c*(1-pct/100);
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img"'
      + ' aria-label="'+esc(label||"")+' '+pct+' เปอร์เซ็นต์">'
      + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="'+sw+'"/>'
      + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+sw+'"'
      + ' stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"'
      + ' transform="rotate(-90 '+size/2+' '+size/2+')"/>'
      + '<text x="'+size/2+'" y="'+(size/2+1)+'" text-anchor="middle" dominant-baseline="middle"'
      + ' font-family="IBM Plex Mono, monospace" font-size="'+(size*0.235).toFixed(1)+'"'
      + ' font-weight="600" fill="var(--ink)">'+pct+'%</text></svg>';
  }
  function bar(pct, cls){
    return '<div class="track"><i class="'+(cls||"")+'" style="width:'+Math.max(0,Math.min(100,pct))+'%"></i></div>';
  }
  function dueText(it){
    if(it.status === "done") return "เสร็จแล้ว";
    if(it.late) return "เกินกำหนด " + Math.abs(it.left) + " วัน";
    if(it.left === 0) return "ครบกำหนดวันนี้";
    return "เหลือ " + it.left + " วัน";
  }
  function statusWord(s){ return s === "done" ? "เสร็จแล้ว" : s === "doing" ? "กำลังทำ" : "ยังไม่เริ่ม"; }
  function stateOf(it){
    return it.status === "done" ? "done" : it.late ? "late" : it.soon ? "soon"
         : it.status === "doing" ? "doing" : "";
  }

  /* ---------- แท็บ ---------- */
  function tabsHTML(){
    var atHome = !view.period && !view.filter;
    var h = '<div class="tabs" role="tablist"><button role="tab" data-goto="" aria-current="'
      + (atHome ? "page" : "false") + '">ภาพรวม</button>';
    ORDER.forEach(function(c){
      h += '<button role="tab" data-goto="'+c+'" aria-current="'
        + (view.period === c ? "page" : "false") + '">' + esc(PERIOD[c].name) + '</button>';
    });
    return h + '</div>';
  }

  /* ---------- หน้าภาพรวม ---------- */
  function renderHome(items){
    var a = summarise(items);
    var late = items.filter(function(x){ return x.late; }).sort(function(p,q){ return p.left - q.left; });
    var soon = items.filter(function(x){ return x.soon; }).sort(function(p,q){ return p.left - q.left; });
    var h = '<div class="panels">';

    // ความคืบหน้ารวม
    h += '<button class="panel c3" data-filter="all"><h3>ความคืบหน้ารวม</h3>'
      + '<div style="display:flex;justify-content:center;padding:2px 0 10px">'
      + ring(a.pct, 116, "var(--cyan)", "ความคืบหน้ารวม") + '</div>'
      + '<div class="kpirow"><span class="cap">ทั้งหมด ' + a.total + ' รายการ</span>'
      + '<span class="delta d-idle">ดูทั้งหมด →</span></div></button>';

    // สถานะงาน
    h += '<button class="panel c5" data-filter="done"><h3>สถานะงานรอบปัจจุบัน</h3>'
      + '<div class="rings">'
      + ringBox(pctOf(a.done, a.total), "var(--teal)",  a.done,  "เสร็จแล้ว")
      + ringBox(pctOf(a.doing, a.total), "var(--cyan)", a.doing, "กำลังทำ")
      + ringBox(pctOf(a.total - a.done - a.doing, a.total), "var(--ink-faint)",
                a.total - a.done - a.doing, "ยังไม่เริ่ม")
      + '</div>'
      + '<div class="kpirow"><span class="cap">แตะเพื่อดูงานที่เสร็จแล้ว</span>'
      + '<span class="delta d-ok">' + a.done + '/' + a.total + '</span></div></button>';

    // ล่าช้า + ใกล้ครบ
    h += '<button class="panel c4" data-filter="late"><h3>ต้องจัดการก่อน'
      + '<span class="c">' + late.length + ' ล่าช้า · ' + soon.length + ' ใกล้ครบ</span></h3>';
    if(!late.length && !soon.length){
      h += '<div class="empty">ไม่มีงานค้างในรอบนี้</div>';
    } else {
      h += '<div class="mini">';
      late.slice(0,4).forEach(function(it){
        h += '<div class="mrow"><div><div class="t">'+esc(it.name)+'</div>'
          + '<div class="s">'+esc(it.period)+'</div></div>'
          + '<div class="r">'+Math.abs(it.left)+' วัน</div></div>';
      });
      soon.slice(0, Math.max(0, 4-late.length)).forEach(function(it){
        h += '<div class="mrow soon"><div><div class="t">'+esc(it.name)+'</div>'
          + '<div class="s">'+esc(it.period)+'</div></div>'
          + '<div class="r">'+it.left+' วัน</div></div>';
      });
      h += '</div>';
    }
    h += '<div class="kpirow"><span class="cap">แตะเพื่อดูงานล่าช้าทั้งหมด</span>'
      + '<span class="delta ' + (late.length ? "d-late" : "d-ok") + '">'
      + (late.length ? late.length + " ล่าช้า" : "ตรงแผน") + '</span></div></button>';

    // ความคืบหน้าตามรอบงาน
    h += '<div class="panel c7"><h3>ความคืบหน้าตามรอบงาน</h3><div class="blist">';
    ORDER.forEach(function(code){
      var g = items.filter(function(x){ return x.code === code; }), s = summarise(g);
      var cls = s.late ? "late" : s.pct === 100 ? "ok" : "";
      h += '<div class="brow"><span class="nm">' + esc(PERIOD[code].name)
        + '  <span style="color:var(--ink-faint);font-size:11px">' + esc(g[0].cyc.label) + '</span></span>'
        + '<span class="vl mono">' + s.done + '/' + s.total + ' · ' + s.pct + '%</span>'
        + bar(s.pct, cls) + '</div>';
    });
    h += '</div></div>';

    // ใกล้ครบกำหนด
    h += '<button class="panel c5" data-filter="soon"><h3>ใกล้ครบกำหนด<span class="c">ภายใน 7 วัน</span></h3>'
      + '<div class="kpirow" style="margin:6px 0 12px"><div><div class="big mono" style="color:var(--amber)">'
      + a.soon + '</div><div class="cap">รายการ</div></div>'
      + ring(a.total ? Math.round(a.soon/a.total*100) : 0, 84, "var(--amber)", "ใกล้ครบกำหนด") + '</div>'
      + '<div class="kpirow"><span class="cap">แตะเพื่อดูรายการ</span>'
      + '<span class="delta d-soon">ดูรายการ →</span></div></button>';

    h += '</div>';

    // รายการทั้งหมด แยกตามรอบ
    ORDER.forEach(function(code){
      var g = items.filter(function(x){ return x.code === code; }), s = summarise(g);
      h += '<div class="panels" style="margin-top:11px"><div class="panel c12">'
        + '<h3>' + esc(PERIOD[code].name)
        + '<span class="c">รอบ ' + esc(g[0].cyc.label) + ' · กำหนด ' + esc(fmtDate(g[0].cyc.due))
        + ' · เสร็จ ' + s.done + '/' + s.total + (s.late ? ' · ล่าช้า ' + s.late : '') + '</span></h3>'
        + '<div class="blist">';
      g.forEach(function(it){
        var st = stateOf(it);
        h += '<button class="brow" data-tile="'+it.id+'" style="background:none;border:none;'
          + 'font:inherit;color:inherit;cursor:pointer;text-align:left;padding:0">'
          + '<span class="nm">' + esc(it.name) + '</span>'
          + '<span class="vl mono">' + esc(dueText(it)) + ' · ' + it.progress + '%</span>'
          + bar(it.progress, st === "done" ? "ok" : st === "late" ? "late" : st === "soon" ? "soon" : "")
          + '</button>';
      });
      h += '</div></div></div>';
    });
    return h;
  }
  function pctOf(n, d){ return d ? Math.round(n/d*100) : 0; }
  function ringBox(pct, color, n, label){
    return '<div class="ringbox">' + ring(pct, 84, color, label)
      + '<div class="lb">' + esc(label) + ' · ' + n + '</div></div>';
  }

  /* ---------- หน้ารายการที่กรองจากแผงสรุป ---------- */
  var FILTERS = {
    all :{title:"ทุกรายการ",       pick:function(x){ return true; },              empty:"ไม่มีรายการ"},
    done:{title:"งานที่เสร็จแล้ว",  pick:function(x){ return x.status==="done"; }, empty:"ยังไม่มีงานที่ทำเสร็จในรอบนี้"},
    soon:{title:"ใกล้ครบกำหนด",    pick:function(x){ return x.soon; },            empty:"ยังไม่มีงานที่ใกล้ครบกำหนดภายใน 7 วัน"},
    late:{title:"งานล่าช้า",        pick:function(x){ return x.late; },            empty:"ไม่มีงานล่าช้า"}
  };
  function renderFilter(items, kind){
    var f = FILTERS[kind] || FILTERS.all, list = items.filter(f.pick);
    var h = '<div class="phead"><h2>' + esc(f.title) + '</h2>'
      + '<div class="sub">' + list.length + ' รายการ · รวมทุกรอบงาน</div></div>';
    if(!list.length) return h + '<div class="panel"><div class="empty">' + esc(f.empty) + '</div></div>';
    list.sort(function(p,q){ return p.left - q.left; });
    h += '<div class="items">';
    list.forEach(function(it){ h += itemHTML(it, true); });
    return h + '</div>';
  }

  /* ---------- หน้ารอบงาน ---------- */
  function renderPeriod(items, code){
    var g = items.filter(function(x){ return x.code === code; });
    var s = summarise(g), p = PERIOD[code], c = g[0].cyc;
    var h = '<div class="phead"><h2>' + esc(p.name) + '</h2>'
      + '<div class="sub">รอบ ' + esc(c.label) + ' · กำหนด ' + esc(fmtDate(c.due)) + ' · ' + esc(p.remind) + '</div></div>'
      + '<div class="panels" style="margin-bottom:12px">'
      + '<div class="panel c4"><h3>ความคืบหน้ารอบนี้</h3>'
      +   '<div style="display:flex;justify-content:center;padding:2px 0 6px">'
      +   ring(s.pct, 104, s.late ? "var(--coral)" : "var(--cyan)", "ความคืบหน้า") + '</div></div>'
      + '<div class="panel c8"><h3>สรุป</h3><div class="blist">'
      +   sumRow("เสร็จแล้ว", s.done, s.total, "ok")
      +   sumRow("กำลังทำ", s.doing, s.total, "")
      +   sumRow("ล่าช้า", s.late, s.total, "late")
      + '</div></div></div>'
      + '<div class="items">';
    g.forEach(function(it){ h += itemHTML(it, false); });
    return h + '</div>';
  }
  function sumRow(label, n, total, cls){
    return '<div class="brow"><span class="nm">' + esc(label) + '</span>'
      + '<span class="vl mono">' + n + '/' + total + '</span>'
      + bar(pctOf(n, total), cls) + '</div>';
  }

  /* ---------- หนึ่งรายการ ---------- */
  function itemHTML(it, showPeriod){
    var open = !!view.open[it.id], st = stateOf(it);
    var h = '<div class="item' + (st ? " is-" + st : "") + '">'
      + '<div class="r1"><div class="nm">'
      +   (showPeriod ? '<span class="ptag">' + esc(it.period) + '</span>' : '')
      +   esc(it.name) + '</div>'
      + '<div class="due">' + esc(dueText(it)) + '</div></div>'
      + '<div class="r2">'
      +   '<div class="seg" role="group" aria-label="สถานะ">'
      +     segBtn(it,"todo","ยังไม่เริ่ม") + segBtn(it,"doing","กำลังทำ") + segBtn(it,"done","เสร็จแล้ว")
      +   '</div>'
      +   '<div class="barwrap">' + bar(it.progress, st === "done" ? "ok" : st === "late" ? "late" : "")
      +     '<span class="pcv mono">' + it.progress + '%</span></div>'
      +   '<button class="rowbtn' + (open ? " on" : "") + '" data-toggle="' + it.id + '">'
      +     (open ? "ปิด" : "รายละเอียด") + '</button>'
      +   (it.late && !it.ack ? '<button class="rowbtn" data-ack="' + it.id + '">รับทราบ</button>' : "")
      +   (it.ack ? '<span class="acked">✓ รับทราบแล้ว</span>' : "")
      + '</div>';
    if(open){
      h += '<div class="detail"><div class="two">'
        + fld("ความคืบหน้า (%)", '<input type="number" min="0" max="100" step="5" value="' + it.progress
            + '" data-f="progress" data-id="' + it.id + '">')
        + fld("ผู้รับผิดชอบ", '<input type="text" value="' + esc(it.owner)
            + '" placeholder="ชื่อผู้รับผิดชอบ" data-f="owner" data-id="' + it.id + '">')
        + '</div>'
        + fld("สถานะเอกสาร", '<select data-f="doc" data-id="' + it.id + '">'
            + opt("none","ยังไม่มีเอกสาร",it.doc) + opt("doing","กำลังจัดทำ",it.doc)
            + opt("done","จัดทำแล้วเสร็จ",it.doc) + '</select>')
        + fld("สาเหตุความล่าช้า", '<textarea placeholder="เช่น รออะไหล่ / เครื่องจักรไม่หยุด / กำลังคนไม่พอ"'
            + ' data-f="reason" data-id="' + it.id + '">' + esc(it.reason) + '</textarea>')
        + fld("หมายเหตุ", '<textarea placeholder="บันทึกเพิ่มเติม" data-f="note" data-id="' + it.id + '">'
            + esc(it.note) + '</textarea>')
        + (it.at ? '<div class="cap">แก้ไขล่าสุด ' + esc(new Date(it.at).toLocaleString("th-TH")) + '</div>' : "")
        + '</div>';
    }
    return h + '</div>';
  }
  function segBtn(it, val, label){
    return '<button data-status="' + val + '" data-id="' + it.id + '" aria-pressed="'
      + (it.status === val) + '">' + esc(label) + '</button>';
  }
  function fld(label, inner){ return '<div class="fld"><label>' + esc(label) + '</label>' + inner + '</div>'; }
  function opt(v, label, cur){
    return '<option value="' + v + '"' + (cur === v ? " selected" : "") + '>' + esc(label) + '</option>';
  }

  /* ---------- วาดทั้งหน้า ---------- */
  function render(){
    var items = build();
    var root = document.getElementById("root");
    var head = '<div class="top"><div class="brand">'
      + '<h1>แผนติดตามงาน ISO · Electrical CV-ITH</h1>'
      + '<p>ITH Hongsa · ติดตามความคืบหน้าตามรอบงาน</p></div>'
      + '<div class="right"><div id="saveState" class="saving"></div><div>'
      + esc(new Date().toLocaleDateString("th-TH",{day:"numeric",month:"long",year:"numeric"}))
      + '</div></div></div>'
      + (mode === "readonly" ? '<div class="ro">มุมมองอ่านอย่างเดียว — บัญชีนี้ไม่มีสิทธิ์แก้ไขสถานะ</div>' : "");

    root.innerHTML = head + tabsHTML()
      + (view.filter ? renderFilter(items, view.filter)
         : view.period ? renderPeriod(items, view.period) : renderHome(items))
      + '<footer>ข้อมูลแผนงานจากไฟล์ “แผนติดตามงาน ISO EE” · แก้ไขสถานะแล้วบันทึกอัตโนมัติ</footer>';
    paintSave();
  }

  /* ---------- รับการกดและการพิมพ์ ---------- */
  document.addEventListener("click", function(e){
    var t = e.target.closest("[data-goto],[data-status],[data-toggle],[data-ack],[data-tile],[data-filter]");
    if(!t) return;
    if(t.hasAttribute("data-goto")){
      view.period = t.getAttribute("data-goto") || null; view.filter = null; view.open = {};
      render(); window.scrollTo(0,0); return;
    }
    if(t.hasAttribute("data-filter")){
      view.filter = t.getAttribute("data-filter"); view.period = null; view.open = {};
      render(); window.scrollTo(0,0); return;
    }
    if(t.hasAttribute("data-tile")){
      var tid = t.getAttribute("data-tile");
      view.period = tid.split("-")[0]; view.filter = null; view.open = {}; view.open[tid] = true;
      render(); window.scrollTo(0,0);
      var el = document.querySelector('[data-toggle="' + tid + '"]');
      if(el && el.scrollIntoView) el.scrollIntoView({block:"center"});
      return;
    }
    var id = t.getAttribute("data-id") || t.getAttribute("data-toggle") || t.getAttribute("data-ack");
    var it = build().filter(function(x){ return x.id === id; })[0];
    if(!it) return;
    if(t.hasAttribute("data-toggle")){ view.open[id] = !view.open[id]; render(); return; }
    if(t.hasAttribute("data-ack")){
      setField(id, it.cyc.key, {ack:{by:"", at:new Date().toISOString()}});
      return;
    }
    if(t.hasAttribute("data-status")){
      var st = t.getAttribute("data-status");
      var patch = {status:st};
      if(st === "done") patch.progress = 100;
      if(st === "todo") patch.progress = 0;
      if(st === "doing" && it.progress === 0) patch.progress = 25;
      setField(id, it.cyc.key, patch);
    }
  });

  document.addEventListener("change", function(e){
    var el = e.target;
    if(!el.hasAttribute || !el.hasAttribute("data-f")) return;
    var id = el.getAttribute("data-id"), f = el.getAttribute("data-f");
    var it = build().filter(function(x){ return x.id === id; })[0];
    if(!it) return;
    var v = el.value;
    if(f === "progress"){
      v = Math.max(0, Math.min(100, parseInt(v,10) || 0));
      var patch = {progress:v};
      if(v === 100) patch.status = "done";
      else if(v > 0 && it.status === "todo") patch.status = "doing";
      else if(v === 0) patch.status = "todo";
      setField(id, it.cyc.key, patch);
    } else {
      setField(id, it.cyc.key, JSON.parse('{"'+f+'":'+JSON.stringify(v)+'}'));
    }
  });

  /* ---------- เริ่มทำงาน ---------- */
  if(!lsAvailable()) mode = "readonly";
  render();
  if(window.claude && window.claude.use){
    window.claude.use("artifact").then(function(api){
      if(api){ artifactApi = api; mode = "live"; }   // หน้าเผยแพร่: บันทึกให้ทุกเครื่อง
      render();
    })["catch"](function(){});
  }
})();
</script>
