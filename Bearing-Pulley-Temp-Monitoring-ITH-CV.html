<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bearing Pulley Temp Monitoring ITH-CV</title>
<style>
  :root{
    --bg:#0f1720; --panel:#16212e; --card:#ffffff; --ink:#0f1720; --muted:#8aa0b6;
    --line:#243244; --shadow:0 6px 18px rgba(0,0,0,.25);
    --warn:#f5a623; --alarm:#e02424;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Segoe UI',Tahoma,Arial,sans-serif;
    background:linear-gradient(180deg,#0f1720,#0b1017);
    color:#e7eef6; min-height:100vh; padding:18px 16px 40px;
  }
  header{max-width:1200px;margin:0 auto 18px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
  .logo{width:46px;height:46px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;color:#c8102e;font-size:13px;letter-spacing:.5px;box-shadow:var(--shadow)}
  .titles h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.3px}
  .titles p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .status{text-align:right;font-size:13px;color:var(--muted)}
  .cd{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:rgba(31,111,235,.12);border:1px solid rgba(31,111,235,.35);color:#9cc2ff;font-size:13px;font-weight:600;white-space:nowrap}
  .cd b{color:#dbe9ff;font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .cd.soon{background:rgba(245,166,35,.14);border-color:rgba(245,166,35,.45);color:#ffd591}
  .cd.soon b{color:#ffe6bf}
  .refresh{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:999px;background:var(--panel);color:#cdd9e5;border:1px solid var(--line);cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;transition:background .15s,border-color .15s}
  .refresh:hover{background:#1c2a3a;border-color:#31465c}
  .refresh:active{transform:translateY(1px)}
  .refresh:disabled{opacity:.7;cursor:default}
  .refresh .ic{display:inline-block;font-size:15px;line-height:1}
  .refresh.spin .ic{animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .status .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2ecc71;margin-right:6px;box-shadow:0 0 0 0 rgba(46,204,113,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,204,113,.5)}70%{box-shadow:0 0 0 8px rgba(46,204,113,0)}100%{box-shadow:0 0 0 0 rgba(46,204,113,0)}}
  .status b{color:#e7eef6}
  .tabs{max-width:820px;margin:0 auto 14px;display:flex;gap:8px;flex-wrap:wrap}
  .tab{padding:7px 16px;border-radius:999px;background:var(--panel);color:var(--muted);border:1px solid var(--line);cursor:pointer;font-size:13px;font-weight:600}
  .tab.active{background:#1f6feb;color:#fff;border-color:#1f6feb}
  .wrap{max-width:820px;margin:0 auto;overflow-x:auto}
  table.temps{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  table.temps th,table.temps td{padding:14px 18px;text-align:left;border-bottom:1px solid var(--line)}
  table.temps thead th{background:#0e1620;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
  table.temps th.num,table.temps td.num{text-align:right;width:22%;white-space:nowrap}
  table.temps tbody tr:last-child td{border-bottom:none}
  table.temps tbody tr:nth-child(even){background:rgba(255,255,255,.02)}
  .bng{display:inline-flex;align-items:center;gap:11px;font-weight:600;font-size:15px;letter-spacing:.3px}
  .sw-b{width:12px;height:12px;border-radius:4px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
  .num .v{font-size:24px;font-weight:700;color:#eef4fb}
  .num .u{font-size:12px;color:#6b7a89;margin-left:3px;font-weight:500}
  .num.ok .v{color:#2ecc71}
  .num.warn .v{color:var(--warn)}
  .num.alarm .v{color:var(--alarm);animation:blink 1s steps(1,end) infinite}
  .num.empty .v{color:#4a5a6b;font-weight:500}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.18}}
  footer{max-width:1200px;margin:26px auto 0;color:var(--muted);font-size:12px;text-align:center;line-height:1.7}
  .legend{display:inline-flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
  <header>
    <div class="logo">ITH</div>
    <div class="titles">
      <h1>Bearing Pulley Temp Monitoring ITH-CV</h1>
      <p>อุณหภูมิแบริ่งพูลเลย์ (°C) · ดึงข้อมูลจากระบบ Primus</p>
    </div>
    <div id="countdown" class="cd" title="เวลาโดยประมาณจนถึงการอัปเดตค่ารอบถัดไป (ทุก ~5 นาที)">⏱ อัปเดตใหม่ใน <b id="cdVal">—</b></div>
    <button id="refreshBtn" class="refresh" type="button" title="ดึงข้อมูลล่าสุดทันที"><span class="ic">↻</span>รีเฟรช</button>
    <a class="refresh" href="spreader.html" style="text-decoration:none" title="ดูแผนภาพ Spreader (SPD)">▦ SPD</a>
    <a class="refresh" href="tripper.html" style="text-decoration:none" title="ดูแผนภาพ Tripper Car">▧ Tripper car</a>
    <div class="status">
      <div><span class="dot"></span>Live</div>
      <div>อัปเดตล่าสุด: <b id="updated">—</b></div>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="wrap">
    <table class="temps">
      <thead><tr><th>Bearing</th><th class="num">L</th><th class="num">R</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <footer>
    <div>เกณฑ์สี: <span style="color:#2ecc71">0–69°C ปกติ</span> · <span style="color:#f5a623">70–79°C เตือน</span> · <span style="color:#e02424">≥ 80°C แจ้งเตือน (กะพริบ)</span></div>
    <div style="margin-top:6px">ข้อมูลรีเฟรชอัตโนมัติทุก 60 วินาที · แหล่งข้อมูลอัปเดตทุก ~5 นาที</div>
  </footer>

<script>
const WARN = 70, ALARM = 80;   // °C thresholds: <70 เขียว, 70-79 ส้ม, >=80 แดงกะพริบ
let DATA = null, activeGroup = null;

function fmtTime(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleString('th-TH',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) + ' น.';
  }catch(e){ return iso; }
}

function render(){
  if(!DATA) return;
  const groups = Object.keys(DATA.groups||{});
  if(!activeGroup || !groups.includes(activeGroup)) activeGroup = groups[0];

  // tabs
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  if(groups.length > 1){
    groups.forEach(g=>{
      const b = document.createElement('div');
      b.className = 'tab' + (g===activeGroup?' active':'');
      b.textContent = g;
      b.onclick = ()=>{ activeGroup=g; render(); };
      tabs.appendChild(b);
    });
  }

  // pair tags (…_L / …_R) into one row per bearing, keeping source order
  const order = [], byBase = {};
  (DATA.groups[activeGroup]||[]).forEach(item=>{
    const m = /^(.*)_(L|R)$/.exec(item.tag);
    const base = m ? m[1] : item.tag;
    const side = m ? m[2] : 'L';
    if(!byBase[base]){ byBase[base] = {color:item.color, L:null, R:null}; order.push(base); }
    byBase[base][side] = item.value;
    if(item.color) byBase[base].color = item.color;
  });

  const cell = (val)=>{
    const v = Number(val);
    if(val==null || isNaN(v)) return '<td class="num empty"><span class="v">—</span></td>';
    let cls = 'num';
    if(v>=ALARM) cls+=' alarm'; else if(v>=WARN) cls+=' warn'; else cls+=' ok';
    return '<td class="'+cls+'"><span class="v">'+v.toFixed(1)+'</span><span class="u">°C</span></td>';
  };

  const rows = document.getElementById('rows');
  rows.innerHTML = order.map(base=>{
    const b = byBase[base];
    return '<tr>'+
      '<td><span class="bng"><span class="sw-b" style="background:'+(b.color||'#334')+'"></span>'+base+'</span></td>'+
      cell(b.L)+cell(b.R)+
    '</tr>';
  }).join('');

  document.getElementById('updated').textContent = fmtTime(DATA.updated);
}

// ---- shared 5-min countdown (persists across pages via localStorage) ----
// stores the wall-clock time of the next update so switching table<->SPD keeps counting
const PERIOD = 5 * 60 * 1000;   // ms
const CD_KEY = 'ith_temp_next_update';
function cdGet(){ const v = parseInt(localStorage.getItem(CD_KEY)||'0',10); return isNaN(v)?0:v; }
function cdSet(t){ try{ localStorage.setItem(CD_KEY, String(t)); }catch(e){} }
function drawCountdown(){
  const el = document.getElementById('cdVal');
  const box = document.getElementById('countdown');
  let rem = cdGet() - Date.now(); if(rem < 0) rem = 0;
  const sec = Math.floor(rem/1000), m = Math.floor(sec/60), s = sec % 60;
  el.textContent = m + ':' + String(s).padStart(2,'0');
  box.classList.toggle('soon', rem <= 60000);
}
function resetCountdown(){ cdSet(Date.now() + PERIOD); drawCountdown(); }   // manual Refresh restarts the cycle
function tickCountdown(){
  const next = cdGet();
  if(!next || next <= Date.now()){   // due (or first run) -> fetch update, schedule next
    load();
    cdSet(Date.now() + PERIOD);
  }
  drawCountdown();
}
setInterval(tickCountdown, 1000);

async function load(){
  try{
    const r = await fetch('temps.json?_=' + Date.now(), {cache:'no-store'});
    DATA = await r.json();
    render();
  }catch(e){ console.error('load failed', e); }
}

async function refresh(){
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spin'); btn.disabled = true;
  await load();
  resetCountdown();          // manual refresh restarts the 5-min cycle
  setTimeout(()=>{ btn.classList.remove('spin'); btn.disabled = false; }, 500);
}
document.getElementById('refreshBtn').addEventListener('click', refresh);

load();            // show data right away
if(!cdGet() || cdGet() <= Date.now()) cdSet(Date.now() + PERIOD);   // start a cycle only if none is running
drawCountdown();   // continue the shared countdown (do NOT reset on page switch)
</script>
</body>
</html>
